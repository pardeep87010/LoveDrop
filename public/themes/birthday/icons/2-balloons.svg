<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <!-- Pink Balloon -->
    <radialGradient id="balloonPink" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFD6E8"/>
      <stop offset="40%" stop-color="#FF8BBF"/>
      <stop offset="100%" stop-color="#D1264F"/>
    </radialGradient>
    <!-- Mint/Cyan Balloon -->
    <radialGradient id="balloonMint" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E2FAF2"/>
      <stop offset="45%" stop-color="#80E5C5"/>
      <stop offset="100%" stop-color="#34B28B"/>
    </radialGradient>
    <!-- Gold/Yellow Balloon -->
    <radialGradient id="balloonGold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="40%" stop-color="#FFD269"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
    <!-- Purple Balloon -->
    <radialGradient id="balloonPurple" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F2E6FF"/>
      <stop offset="45%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </radialGradient>
    <filter id="balloonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#3A2340" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Ground / Base shadow -->
  <ellipse cx="96" cy="180" rx="36" ry="6" fill="#3A2340" opacity="0.12"/>

  <!-- Balloon Strings -->
  <path d="M68 96 Q 78 135 96 172" stroke="#AA8FA5" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M124 96 Q 114 135 96 172" stroke="#AA8FA5" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M96 82 Q 96 130 96 172" stroke="#8E7188" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M72 120 Q 86 148 96 172" stroke="#C0A8BC" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Strings bow -->
  <circle cx="96" cy="172" r="3.5" fill="#D1264F"/>

  <!-- Back Left: Mint Balloon -->
  <g filter="url(#balloonShadow)">
    <ellipse cx="64" cy="74" rx="26" ry="32" fill="url(#balloonMint)" transform="rotate(-10 64 74)"/>
    <ellipse cx="58" cy="62" rx="7" ry="14" fill="#FFFFFF" opacity="0.45" transform="rotate(-18 58 62)"/>
    <polygon points="64,105 60,111 68,111" fill="#34B28B"/>
  </g>

  <!-- Back Right: Gold Balloon -->
  <g filter="url(#balloonShadow)">
    <ellipse cx="128" cy="74" rx="26" ry="32" fill="url(#balloonGold)" transform="rotate(10 128 74)"/>
    <ellipse cx="122" cy="62" rx="7" ry="14" fill="#FFFFFF" opacity="0.45" transform="rotate(2 122 62)"/>
    <polygon points="128,105 124,111 132,111" fill="#F59E0B"/>
  </g>

  <!-- Front Left: Purple Balloon -->
  <g filter="url(#balloonShadow)">
    <ellipse cx="76" cy="95" rx="24" ry="29" fill="url(#balloonPurple)" transform="rotate(-6 76 95)"/>
    <ellipse cx="70" cy="84" rx="6" ry="12" fill="#FFFFFF" opacity="0.5" transform="rotate(-12 70 84)"/>
    <polygon points="76,123 72,128 80,128" fill="#8B5CF6"/>
  </g>

  <!-- Front Center: Big Pink Heart/Round Balloon -->
  <g filter="url(#balloonShadow)">
    <ellipse cx="102" cy="58" rx="30" ry="36" fill="url(#balloonPink)" transform="rotate(4 102 58)"/>
    <!-- Specular highlight -->
    <ellipse cx="94" cy="42" rx="9" ry="18" fill="#FFFFFF" opacity="0.55" transform="rotate(-8 94 42)"/>
    <circle cx="114" cy="40" r="3.5" fill="#FFFFFF" opacity="0.6"/>
    <polygon points="103,93 98,99 108,99" fill="#D1264F"/>
  </g>
</svg>
